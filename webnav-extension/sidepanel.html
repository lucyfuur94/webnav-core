<!-- webnav-extension/sidepanel.html — "Navigation console" (design-off winner) -->
<meta charset="utf-8">
<style>
  /* ────────────────────────────────────────────────────────────────────────
     webnav agent — navigation console
     A cartographic instrument panel. Claude's prose is humanist; the agent's
     actions read as a route ledger traced down a rail of map-pin waypoints.
     Ground is an off-neutral with a faint #5b9dff bias (paper-with-blue-cast
     in light; charted slate in dark). Both themes designed with equal care.
     ──────────────────────────────────────────────────────────────────────── */
  :root {
    color-scheme: light dark;

    /* Type roles */
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", "Cascadia Code", Menlo, Consolas, monospace;

    /* LIGHT — charted paper: warm-neutral with a cool blue cast, never pure white */
    --bg:        #eef1f6;   /* the sheet */
    --panel:     #f8fafd;   /* raised surfaces, composer */
    --sunken:    #e4e8f0;   /* inputs, wells */
    --ink:       #1a2230;   /* primary text */
    --ink-soft:  #4a5568;   /* secondary prose */
    --ink-faint: #7b8598;   /* labels, coordinates */
    --rule:      #d2d9e4;   /* hairlines */
    --rule-soft: #dde3ec;
    --accent:    #2f6fe0;   /* brand pin, tuned darker for AA on paper */
    --accent-ink:#0d3a8f;   /* accent text on light */
    --on-accent: #ffffff;
    --user-bg:   #dbe6fb;   /* user goal bubble */
    --user-ink:  #163a7a;
    --ok:        #1a8a4e;
    --ok-bg:     #dcf1e5;
    --err:       #c23b3b;
    --err-bg:    #f6e0e0;
    --warn:      #9a6b00;
    --rail:      #c3ccdb;   /* route rail hairline */
    --rail-live: #2f6fe0;
    --shadow:    0 1px 2px rgba(26,34,48,.06), 0 8px 24px rgba(26,42,74,.08);
    --focus:     #2f6fe0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      /* DARK — charted slate: blue-biased near-black, never flat #000 */
      --bg:        #0d1017;
      --panel:     #141924;
      --sunken:    #0a0d13;
      --ink:       #e7ecf4;
      --ink-soft:  #a4aec0;
      --ink-faint: #6b7688;
      --rule:      #232b3a;
      --rule-soft: #1b2230;
      --accent:    #5b9dff;
      --accent-ink:#8fbcff;
      --on-accent: #08131f;
      --user-bg:   #17263f;
      --user-ink:  #bcd4ff;
      --ok:        #43c07a;
      --ok-bg:     #10281c;
      --err:       #ff7b7b;
      --err-bg:    #2a1417;
      --warn:      #e2b93d;
      --rail:      #29344a;
      --rail-live: #5b9dff;
      --shadow:    0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
      --focus:     #5b9dff;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 26%, transparent); }

  /* Faint chart-grid wash on the ground — the "map" texture, kept to a whisper. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(color-mix(in srgb, var(--rule) 40%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--rule) 40%, transparent) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: .35;
    z-index: 0;
  }
  body > * { position: relative; z-index: 1; }

  /* ───────────────────────── Header ───────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 11px 13px 10px;
    border-bottom: 1px solid var(--rule);
    background: var(--panel);
  }
  .mark {
    width: 22px; height: 22px;
    flex: 0 0 auto;
    color: var(--accent);
  }
  .mark svg { display: block; width: 100%; height: 100%; }
  /* The mark pulses while the agent is driving — a living waypoint. */
  body.running .mark { animation: markpulse 1.6s ease-in-out infinite; }
  @keyframes markpulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: .6; transform: scale(.92); }
  }
  .brand { display: flex; flex-direction: column; line-height: 1.1; flex: 1; min-width: 0; }
  .brand .name {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--ink);
  }
  .brand .name b { color: var(--accent); font-weight: 600; }
  .brand .tab {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-faint);
    margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .brand .tab:empty { display: none; }

  /* Connection lamp — a coordinate readout, not a chat "online" dot. */
  .conn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-faint);
    padding: 4px 8px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: var(--bg);
    white-space: nowrap;
    cursor: default;
    max-width: 46%;
    overflow: hidden; text-overflow: ellipsis;
  }
  .conn .lamp {
    width: 7px; height: 7px; border-radius: 50%;
    flex: 0 0 auto;
    background: var(--ink-faint);
    box-shadow: 0 0 0 0 transparent;
  }
  .conn.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--rule)); }
  .conn.ok .lamp { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .conn.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--rule)); }
  .conn.err .lamp { background: var(--err); }

  .icon-btn {
    flex: 0 0 auto;
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--rule);
    border-radius: 7px;
    background: var(--bg);
    color: var(--ink-faint);
    cursor: pointer;
    padding: 0;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .icon-btn svg { width: 15px; height: 15px; }

  /* ───────────────────────── Settings drawer ───────────────────────── */
  details.config {
    border-bottom: 1px solid var(--rule);
    background: var(--panel);
  }
  details.config summary {
    list-style: none;
    cursor: pointer;
    padding: 8px 13px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: flex; align-items: center; gap: 6px;
  }
  details.config summary::-webkit-details-marker { display: none; }
  details.config summary::before { content: "\25B8"; font-size: 9px; }
  details.config[open] summary::before { content: "\25BE"; }
  .config-body { padding: 2px 13px 12px; display: flex; flex-direction: column; gap: 9px; }
  .config-body label {
    display: flex; flex-direction: column; gap: 4px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .04em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .config-body input {
    font-family: var(--mono); font-size: 12px;
    padding: 7px 9px;
    border: 1px solid var(--rule);
    border-radius: 7px;
    background: var(--sunken);
    color: var(--ink);
    text-transform: none; letter-spacing: 0;
  }
  .config-body input::placeholder { color: var(--ink-faint); }
  .config-body input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-color: transparent; }

  /* ───────────────────────── Thread (the route) ───────────────────────── */
  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    scrollbar-width: thin;
  }
  #thread::-webkit-scrollbar { width: 8px; }
  #thread::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 8px; }

  /* User goal — a waypoint entered by hand. Right-aligned card. */
  .msg.user {
    align-self: flex-end;
    max-width: 88%;
    margin: 10px 0 4px;
    padding: 9px 12px;
    background: var(--user-bg);
    color: var(--user-ink);
    border-radius: 12px 12px 4px 12px;
    font-size: 13px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: var(--shadow);
  }
  .msg.user::before {
    content: "GOAL";
    display: block;
    font-family: var(--mono);
    font-size: 9px; letter-spacing: .12em;
    color: color-mix(in srgb, var(--user-ink) 60%, transparent);
    margin-bottom: 3px;
  }

  /* Claude's prose — humanist, warm, left, no bubble chrome. It speaks. */
  .msg.assistant {
    align-self: stretch;
    max-width: 100%;
    padding: 3px 2px 6px 2px;
    color: var(--ink);
    font-size: 13.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.assistant.streaming::after {
    content: "";
    display: inline-block;
    width: 7px; height: 15px;
    margin-left: 1px;
    vertical-align: text-bottom;
    background: var(--accent);
    animation: caret 1.1s step-end infinite;
  }
  @keyframes caret { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

  /* ── The route rail: agent actions traced down a hairline with pin waypoints ──
     Consecutive .msg.action rows are grouped by JS into a .route rail; a lone
     action still shows its own pin, so the CSS anchors the rail on the action
     itself as a fallback (a .route wrapper just draws the shared spine). */
  .route {
    align-self: stretch;
    position: relative;
    margin: 5px 0 5px 7px;
    padding-left: 22px;
    border-left: 1.5px solid var(--rail);
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .msg.action {
    position: relative;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--ink-soft);
    padding: 1px 0;
  }
  /* A stray action not wrapped in a .route still reads as a ledger row. */
  #thread > .msg.action {
    align-self: stretch;
    margin: 5px 0 5px 7px;
    padding-left: 22px;
    border-left: 1.5px solid var(--rail);
  }
  /* waypoint pin sitting on the rail */
  .route .msg.action::before,
  #thread > .msg.action::before {
    content: "";
    position: absolute;
    top: 3px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--panel);
    border: 1.5px solid var(--rail);
    box-shadow: 0 0 0 3px var(--bg);
  }
  .route .msg.action::before { left: -29px; }   /* onto the shared rail */
  #thread > .msg.action::before { left: -6px; }  /* onto its own left border */
  .msg.action .verb {
    color: var(--accent-ink);
    font-weight: 600;
  }
  .msg.action .target { color: var(--ink); }
  /* the live (most recent) action: filled pin, faint pulse, brighter rail above it */
  .msg.action.live::before {
    background: var(--rail-live);
    border-color: var(--rail-live);
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px color-mix(in srgb, var(--rail-live) 30%, transparent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .msg.action.live { color: var(--ink); }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px color-mix(in srgb, var(--rail-live) 34%, transparent); }
    50%     { box-shadow: 0 0 0 3px var(--bg), 0 0 0 7px color-mix(in srgb, var(--rail-live) 10%, transparent); }
  }

  /* Done — the route reaches its destination (a solid pin, checkmark). */
  .msg.done {
    align-self: stretch;
    margin: 8px 0 4px;
    padding: 9px 11px;
    background: var(--ok-bg);
    color: var(--ok);
    border: 1px solid color-mix(in srgb, var(--ok) 34%, transparent);
    border-radius: 10px;
    font-size: 12.5px;
    line-height: 1.45;
    display: flex; align-items: flex-start; gap: 8px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.done::before, .msg.error::before {
    flex: 0 0 auto; margin-top: 1px;
    width: 16px; height: 16px;
    display: inline-block;
    background: currentColor;
    -webkit-mask: var(--glyph) center / contain no-repeat;
            mask: var(--glyph) center / contain no-repeat;
    content: "";
  }
  .msg.done::before {
    --glyph: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>');
  }
  .msg.error::before {
    --glyph: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>');
  }

  .msg.error {
    align-self: stretch;
    margin: 8px 0 4px;
    padding: 9px 11px;
    background: var(--err-bg);
    color: var(--err);
    border: 1px solid color-mix(in srgb, var(--err) 34%, transparent);
    border-radius: 10px;
    font-size: 12.5px;
    line-height: 1.45;
    display: flex; align-items: flex-start; gap: 8px;
    white-space: pre-wrap; word-break: break-word;
  }

  /* ── Plan approval (Ask mode): a route brief awaiting sign-off ── */
  .plan {
    align-self: stretch;
    margin: 8px 0 4px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .plan .head {
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule-soft);
    font-family: var(--mono);
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint);
    display: flex; align-items: center; gap: 6px;
  }
  .plan .head .pin { width: 12px; height: 12px; color: var(--accent); flex: 0 0 auto; }
  .plan ol {
    list-style: none;
    margin: 0; padding: 10px 12px 4px;
    counter-reset: step;
  }
  .plan li {
    counter-increment: step;
    position: relative;
    padding: 5px 0 5px 26px;
    font-size: 12.5px;
    color: var(--ink);
    line-height: 1.4;
    word-break: break-word;
  }
  .plan li::before {
    content: counter(step, decimal-leading-zero);
    position: absolute; left: 0; top: 5px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    font-weight: 600;
  }
  .plan li:not(:last-child)::after {
    content: "";
    position: absolute; left: 5px; top: 20px; bottom: -1px;
    width: 1px;
    background: var(--rule);
  }
  .plan .note {
    padding: 2px 12px 6px;
    font-family: var(--mono); font-size: 10px;
    color: var(--ink-faint);
  }
  .plan .bar { display: flex; gap: 8px; padding: 8px 12px 12px; }
  .plan .bar button {
    flex: 1; padding: 8px; border-radius: 8px; font: 600 12.5px var(--sans);
    cursor: pointer; border: 1px solid transparent;
  }
  .plan .approve { background: var(--accent); color: var(--on-accent); }
  .plan .approve:hover { filter: brightness(1.06); }
  .plan .deny { background: transparent; color: var(--ink-soft); border-color: var(--rule); }
  .plan .deny:hover { border-color: var(--err); color: var(--err); }
  .plan .resolved {
    padding: 9px 12px; font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
    display: flex; align-items: center; gap: 6px;
  }

  /* ───────────────────────── Empty / first-run state ───────────────────────── */
  .empty {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 24px 22px;
    gap: 0;
  }
  .empty .bigmark {
    width: 52px; height: 52px;
    color: var(--accent);
    margin-bottom: 14px;
    opacity: .95;
  }
  .empty h2 {
    margin: 0 0 6px;
    font-family: var(--mono);
    font-size: 15px; font-weight: 600; letter-spacing: .01em;
    color: var(--ink);
  }
  .empty p {
    margin: 0 0 18px;
    font-size: 12.5px; line-height: 1.5;
    color: var(--ink-soft);
    max-width: 260px;
  }
  .empty .examples {
    width: 100%;
    display: flex; flex-direction: column; gap: 7px;
    margin-bottom: 18px;
  }
  .empty .ex {
    text-align: left;
    padding: 9px 11px 9px 30px;
    position: relative;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 9px;
    font-size: 12px; color: var(--ink);
    cursor: pointer;
    font-family: var(--sans);
  }
  .empty .ex:hover { border-color: var(--accent); }
  .empty .ex::before {
    content: "";
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 9px; height: 9px; border-radius: 50%;
    border: 1.5px solid var(--accent);
  }
  /* server-prereq strip — teaches the one real dependency without a wall of text */
  .empty .prereq {
    width: 100%;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 11px;
    border: 1px dashed var(--rule);
    border-radius: 9px;
    font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-faint);
    text-align: left;
  }
  .empty .prereq code {
    color: var(--accent-ink);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    padding: 2px 5px; border-radius: 5px;
    font-size: 10.5px;
    white-space: nowrap;
  }
  .empty .prereq.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 34%, transparent); border-style: solid; }

  /* ───────────────────────── Composer ───────────────────────── */
  footer {
    border-top: 1px solid var(--rule);
    background: var(--panel);
    padding: 10px 12px 12px;
  }
  .composer {
    border: 1px solid var(--rule);
    border-radius: 12px;
    background: var(--sunken);
    padding: 8px 10px 8px;
    transition: border-color .12s;
  }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  #goal {
    width: 100%;
    resize: none;
    min-height: 22px; max-height: 140px;
    border: 0; padding: 0; margin: 0;
    background: transparent; color: var(--ink);
    font: 13px/1.5 var(--sans);
    outline: none;
  }
  #goal::placeholder { color: var(--ink-faint); }

  .controls {
    display: flex; align-items: center; gap: 7px;
    margin-top: 8px;
  }

  /* Permission mode — a segmented instrument switch (Ask / Auto / Act).
     #mode is the container; sidepanel.ts wires its three <button data-mode> to
     the mode state (aria-pressed reflects the active one). */
  .modeswitch {
    display: inline-flex;
    flex: 0 0 auto;
    background: var(--sunken);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 2px;
    font-family: var(--mono);
  }
  .modeswitch button {
    border: 0; background: transparent;
    font: 600 10.5px var(--mono);
    letter-spacing: .03em;
    color: var(--ink-faint);
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .modeswitch button[aria-pressed="true"] {
    background: var(--panel);
    color: var(--accent-ink);
    box-shadow: var(--shadow);
  }

  .spacer { flex: 1; }

  #send {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    border: 0; border-radius: 8px;
    background: var(--accent); color: var(--on-accent);
    font: 600 12.5px var(--sans);
    cursor: pointer;
  }
  #send:hover { filter: brightness(1.06); }
  #send:disabled { opacity: .5; cursor: default; filter: none; }
  #send svg { width: 14px; height: 14px; }

  /* Running controls — replace Send while the agent drives. Toggled by JS via
     the body.running class (set on run start, cleared on finish). */
  .run-controls { display: none; align-items: center; gap: 7px; flex: 0 0 auto; }
  body.running .run-controls { display: inline-flex; }
  body.running #send { display: none; }
  .runbtn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 7px 12px; border-radius: 8px; cursor: pointer;
    font: 600 12px var(--sans);
    border: 1px solid var(--rule);
    background: var(--panel); color: var(--ink);
  }
  .runbtn svg { width: 13px; height: 13px; }
  .runbtn.pause:hover { border-color: var(--warn); color: var(--warn); }
  .runbtn.stop { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--rule)); }
  .runbtn.stop:hover { background: var(--err); color: var(--on-accent); border-color: var(--err); }

  /* Live activity strip — the instrument "working" readout above the composer.
     Shown only while body.running. */
  .activity {
    display: none;
    align-items: center; gap: 9px;
    padding: 7px 11px;
    margin-bottom: 9px;
    background: var(--sunken);
    border: 1px solid var(--rule);
    border-radius: 9px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }
  body.running .activity { display: flex; }
  .activity .beam {
    position: relative;
    flex: 1; height: 3px; border-radius: 3px;
    background: var(--rule);
    overflow: hidden;
  }
  .activity .beam::after {
    content: "";
    position: absolute; inset: 0;
    width: 38%;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: sweep 1.4s ease-in-out infinite;
  }
  @keyframes sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
  .activity .label { flex: 0 0 auto; color: var(--accent-ink); letter-spacing: .02em; }
  .activity .step { flex: 0 0 auto; color: var(--ink-faint); }

  /* Focus visibility everywhere */
  button:focus-visible, summary:focus-visible, .ex:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .msg.action.live::before, .activity .beam::after,
    .msg.assistant.streaming::after, body.running .mark { animation: none; }
    .activity .beam::after { width: 100%; opacity: .6; transform: none; }
    .msg.assistant.streaming::after { opacity: 1; }
    body.running .mark { opacity: 1; transform: none; }
  }

  @media (max-width: 340px) {
    .modeswitch button { padding: 4px 6px; }
    #send span { display: none; }
    #send { padding: 7px 10px; }
    .conn { max-width: 40%; }
  }
</style>
