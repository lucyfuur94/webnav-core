<!-- webnav-extension/sidepanel.html -->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  header { padding: 10px 12px; border-bottom: 1px solid #8883; display: flex;
    align-items: center; gap: 8px; }
  header h1 { font-size: 13px; margin: 0; flex: 1; }
  header button { border: 0; background: #8882; color: inherit; font: inherit;
    padding: 3px 8px; border-radius: 6px; cursor: pointer; }

  details.config { padding: 8px 12px; border-bottom: 1px solid #8883; }
  details.config summary { cursor: pointer; color: #888; font-size: 11px; }
  details.config label { display: block; margin: 8px 0 0; color: #888; font-size: 11px; }
  details.config input { width: 100%; padding: 5px 7px; margin-top: 3px;
    border: 1px solid #ccc3; border-radius: 6px; font: inherit; background: #8881; color: inherit; }

  #thread { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: #4a7cff22; align-self: flex-end; max-width: 85%; }
  .msg.assistant { background: #8881; align-self: flex-start; max-width: 95%; }
  .msg.action { background: transparent; color: #888; font-size: 11px; padding: 2px 10px; align-self: flex-start; }
  .msg.error { background: #e5484d22; color: #e5484d; align-self: flex-start; max-width: 95%; }
  .msg.done { background: #30a46c22; color: #30a46c; align-self: flex-start; max-width: 95%; }

  .plan { background: #8881; border-radius: 8px; padding: 10px; align-self: stretch; }
  .plan ol { margin: 4px 0 10px; padding-left: 20px; }
  .plan .bar { display: flex; gap: 8px; }
  .plan .bar button { flex: 1; padding: 6px; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
  .plan .approve { background: #30a46c; color: #fff; }
  .plan .deny { background: #e5484d; color: #fff; }

  footer { border-top: 1px solid #8883; padding: 10px 12px; }
  #goal { width: 100%; resize: vertical; min-height: 44px; padding: 6px 8px;
    border: 1px solid #ccc3; border-radius: 6px; font: inherit; background: #8881; color: inherit; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  #mode { flex: 0 0 auto; padding: 6px 10px; border-radius: 6px; border: 1px solid #8884;
    background: #8882; color: inherit; font: inherit; cursor: pointer; }
  #send { flex: 1; padding: 7px; border: 0; border-radius: 6px; font: inherit; font-weight: 600;
    cursor: pointer; background: #4a7cff; color: #fff; }
  #stop { flex: 0 0 auto; padding: 7px 12px; border: 0; border-radius: 6px; font: inherit;
    font-weight: 600; cursor: pointer; background: #e5484d; color: #fff; display: none; }
  #stop.active { display: inline-block; }
  #conn { font-size: 11px; color: #888; }
  #conn.ok { color: #30a46c; }
</style>

<header>
  <h1>webnav agent</h1>
  <span id="conn">connecting…</span>
</header>

<details class="config">
  <summary>settings</summary>
  <label>Session <input id="sid" value="agent-1"></label>
  <label>Server base <input id="base" value="http://127.0.0.1:7779"></label>
</details>

<div id="thread"></div>

<footer>
  <textarea id="goal" placeholder="Describe a goal (e.g. log in as standard_user and open the cart)…"></textarea>
  <div class="row">
    <button id="mode" title="Cycle permission mode">Ask</button>
    <button id="send">Send</button>
    <button id="stop">Stop</button>
  </div>
</footer>

<script src="sidepanel.js" type="module"></script>
