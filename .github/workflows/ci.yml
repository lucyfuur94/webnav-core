name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: CLI tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` was hanging in CI (`Exit handler never called!`) after the agent-SDK
      # dependency enlarged the tree with os/cpu-gated optional native packages — a known
      # npm 10.x stall. Retry/timeout config + --no-audit/--no-fund makes the install
      # resilient; --foreground-scripts surfaces any native build instead of silently hanging.
      - name: Install deps
        run: npm ci --no-audit --no-fund --foreground-scripts
        env:
          NPM_CONFIG_FETCH_RETRIES: "5"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
          NPM_CONFIG_FETCH_TIMEOUT: "120000"
      - name: Typecheck
        # --no-install: use the LOCAL typescript; never silently fetch the unrelated
        # `tsc` npm package (the confusing "This is not the tsc command" failure seen when
        # node_modules was incomplete). Fails loudly if typescript isn't installed.
        run: npx --no-install tsc --noEmit
      - name: Unit tests (gated live e2e skipped without WEBNAV_LIVE)
        run: npm test
