name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: CLI tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # ROOT CAUSE: `npm ci` hung in CI (`Exit handler never called!`) — an npm 10.x
      # internal exit-handler bug that setup-node's bundled npm hits after the agent-SDK
      # enlarged the dependency tree. It does NOT reproduce on npm 11 (verified: `npm ci`
      # runs clean in 2s locally on npm 11.x). Pin npm above the buggy line to remove the
      # code path entirely, rather than just dodging its trigger.
      - name: Pin npm (avoid npm 10.x 'Exit handler never called' bug)
        run: npm i -g npm@11
      # --prefer-offline: `cache: npm` above is warm, so skip the registry/audit path.
      # --no-audit: avoids the audit POST that most reliably tripped the 10.x hang.
      - name: Install deps
        run: npm ci --no-audit --prefer-offline
      - name: Typecheck
        # --no-install: use the LOCAL typescript; never silently fetch the unrelated
        # `tsc` npm package (the confusing "This is not the tsc command" failure seen when
        # node_modules was incomplete). Fails loudly if typescript isn't installed.
        run: npx --no-install tsc --noEmit
      - name: Unit tests (gated live e2e skipped without WEBNAV_LIVE)
        run: npm test
